name: flutter_tts
description: A flutter plugin for Text to Speech, trimmed to Android for Moru.
version: 4.2.3
homepage: https://github.com/dlutton/flutter_tts

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.tundralabs.fluttertts
        pluginClass: FlutterTtsPlugin

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=1.22.0"
dev_dependencies:
  lints: ^3.0.0
