name: Moru localization development (temporary)
on:
  push:
    branches: ['feat/russian-android-arm64']
    paths: ['.github/workflows/moru-l10n-development.yml', 'tool/moru-translation-stage/apply.py']
permissions:
  contents: write
concurrency:
  group: moru-l10n-development
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/russian-android-arm64
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify the new runtime test rejects the original missing locale
        if: hashFiles('lib/l10n/app_ru.arb') == ''
        shell: bash
        run: |
          set -o pipefail
          if flutter test test/l10n/moru_russian_test.dart --plain-name 'Russian is supported without removing English or Chinese' --reporter expanded > ru-before.log 2>&1; then
            cat ru-before.log
            echo 'Expected the missing-Russian regression to fail before implementation'
            exit 1
          fi
          cat ru-before.log
          grep -q 'Expected: true' ru-before.log
      - name: Assemble and apply reviewed localization
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'feat/russian-android-arm64'
          if [ ! -f lib/l10n/app_ru.arb ]; then python3 tool/moru-translation-stage/assemble.py; fi
          if [ -f tool/moru-translation-stage/apply.py ]; then python3 tool/moru-translation-stage/apply.py; fi
          flutter gen-l10n
          dart format lib/l10n test/l10n
          git diff --check
          git add lib/l10n test/l10n
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'l10n(ru): generate the full Russian catalog with Flutter gen-l10n'
            git push origin HEAD:refs/heads/feat/russian-android-arm64
          fi
      - name: Inspect runtime translations
        shell: bash
        run: flutter test test/l10n/moru_russian_test.dart --reporter expanded 2>&1 | tee ru-runtime-tests.log
      - name: Export the remaining presentation source for review
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil, re
          dest = Path('moru-localization-review')
          dest.mkdir(exist_ok=True)
          for path in ('lib/l10n/app_ru.arb','lib/l10n/app_en.arb','lib/l10n/app_localizations_ru.dart', 'tool/check_moru_ru.py', 'lib/main.dart','lib/core/providers/settings_provider.dart','lib/core/services/mobile_background.dart','lib/core/services/notification_service.dart','test/core/providers/settings_provider_locale_test.dart','test/support/business_test_harness.dart'):
              p = Path(path)
              if p.is_file():
                  target = dest / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(p, target)
          candidates = []
          for top in ('lib/features','lib/shared','android/app/src/main'):
              for p in sorted(Path(top).rglob('*')):
                  if not p.is_file() or p.suffix not in ('.dart','.kt','.xml'): continue
                  text = p.read_text(errors='replace')
                  # Select UI source files with hardcoded labels or bilingual helpers;
                  # complete selected files are included to retain scope/const context.
                  if re.search(r"(?:Text\(|(?:title|subtitle|label|hintText|tooltip|message|semanticLabel)\s*:)\s*['\"][A-Za-z\u4e00-\u9fff]|(?:isZh|languageCode\s*==\s*['\"]zh|String _t\w*\()", text) or p.suffix in ('.kt','.xml'):
                      target = dest / p
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(p, target)
                      candidates.append(str(p))
          (dest/'selected-source-files.json').write_text(json.dumps(candidates, indent=2))
          if Path('lib/l10n/app_ru.arb').exists():
              en = json.loads(Path('lib/l10n/app_en.arb').read_text())
              ru = json.loads(Path('lib/l10n/app_ru.arb').read_text())
              unchanged = {k:v for k,v in en.items() if not k.startswith('@') and ru.get(k)==v and re.search('[A-Za-z]',v)}
              (dest/'unchanged-candidates.json').write_text(json.dumps(unchanged, ensure_ascii=False, indent=2))
          PY
      - name: Check signing material presence without exposing any values
        if: always()
        env:
          KEYSTORE: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          result = {k:bool(os.environ.get(k)) for k in ('KEYSTORE','STORE_PASSWORD','KEY_ALIAS','KEY_PASSWORD')}
          result['ready'] = all(result.values())
          Path('moru-localization-review/signing-availability.json').write_text(json.dumps(result,indent=2))
          print('Existing Android release-signing configuration present:', result['ready'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moru-localization-review
          path: |
            moru-localization-review/
            ru-before.log
            ru-runtime-tests.log
          retention-days: 14
