name: Moru localization development (temporary)
on:
  push:
    branches: ['feat/russian-android-arm64']
    paths: ['tool/moru-translation-stage/run.txt']
permissions:
  contents: write
concurrency:
  group: moru-l10n-development
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'mishaqp/Moru'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply final reviewed translations and generate Dart
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'feat/russian-android-arm64'
          python3 tool/moru-translation-stage/prepare_final.py
          python3 tool/moru-translation-stage/finalize.py
          flutter gen-l10n
          git ls-files -m -o --exclude-standard -- lib test | grep '\.dart$' | xargs -r dart format
          python3 tool/test_check_moru_ru.py
          python3 tool/check_moru_ru.py
          git diff --check
      - name: Verify RU/EN preference, notification, widget and search behavior
        shell: bash
        run: |
          flutter test test/l10n test/core/providers/moru_locale_preferences_test.dart test/core/providers/settings_provider_locale_test.dart test/features/settings/search/settings_search_widgets_test.dart --reporter expanded 2>&1 | tee ru-runtime-tests.log
      - name: Analyze all application code and tests
        shell: bash
        run: dart analyze --fatal-infos lib test integration_test 2>&1 | tee ru-analyzer.log
      - name: Commit checked source only if the branch has not changed
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current="$(git ls-remote origin refs/heads/feat/russian-android-arm64 | cut -f1)"
          test "$current" = "$GITHUB_SHA" || { echo 'Branch changed; preserving generated sources in artifact instead of overwriting'; exit 1; }
          git add lib test tool/check_moru_ru.py tool/moru_ru_technical_allowlist.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'l10n(ru): finish Android labels and verify Russian settings navigation'
            git push origin HEAD:refs/heads/feat/russian-android-arm64
          fi
          echo 'Full Flutter tests and Android APK verification remain mandatory in the final PR; this development job is not that gate.'
      - name: Export review sources and diagnostics
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, shutil, subprocess
          dest=Path('moru-localization-review')
          dest.mkdir(exist_ok=True)
          for top in ('lib','test/l10n','test/core/providers','test/features/settings/search','tool'):
              for p in Path(top).rglob('*'):
                  if not p.is_file() or p.suffix not in ('.dart','.arb','.py','.json'): continue
                  if 'moru-translation-stage' in p.parts: continue
                  target=dest/p
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(p,target)
          (dest/'diff.patch').write_text(subprocess.check_output(['git','diff'],text=True))
          candidates=[]
          for p in sorted(Path('lib').rglob('*.dart')):
              if 'l10n' in p.parts or p.name.endswith('.g.dart'): continue
              for i,line in enumerate(p.read_text().splitlines(),1):
                  if re.search(r"(?:Text\(|(?:title|subtitle|label|hintText|tooltip|semanticLabel)\s*:)\s*['\"][A-Za-z\u4e00-\u9fff]|(?:isZh|languageCode\s*==\s*['\"]zh)",line):
                      candidates.append({'path':str(p),'line':i,'text':line.strip()})
          (dest/'remaining-candidates.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moru-localization-review
          path: |
            moru-localization-review/
            ru-runtime-tests.log
            ru-analyzer.log
          retention-days: 14
