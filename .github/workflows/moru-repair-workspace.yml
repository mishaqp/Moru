name: Temporary Moru repair workspace
on:
  push:
    branches: ['fix/codex-android-network-v0.1.4']
    paths: ['.github/workflows/moru-repair-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Archive only tracked source and the public Dart SDK
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip HEAD -o moru-source.zip
          tar -czf moru-dart-sdk.tgz -C "$FLUTTER_ROOT/bin/cache" dart-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: moru-repair-source
          path: moru-source.zip
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: moru-repair-dart-sdk
          path: moru-dart-sdk.tgz
          retention-days: 1
