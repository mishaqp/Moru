name: Moru Android arm64
on:
  pull_request:
    branches: ['master']
  push:
    branches: ['master']
    paths: ['pubspec.yaml', '.github/workflows/moru-android.yml']
  workflow_dispatch:
    inputs:
      variant:
        description: 'debug for validation; release requires the permanent signing secrets'
        required: true
        default: debug
        type: choice
        options: [debug, release]
      publish:
        description: 'Publish a GitHub release after a release build (opt-in)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: moru-android-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.44.9'
  # Pull requests from this repository build the signed release APK and publish
  # it as a pre-release; fork pull requests have no signing secrets.
  SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
  BUILD_VARIANT: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'release' || inputs.variant || 'debug' }}
jobs:
  android:
    name: Android arm64 APK and native tests
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify Android-only repository policy
        run: |
          python3 -m unittest discover -s tool -p 'test_android_only_policy.py' -v
          python3 -m unittest discover -s tool -p 'test_verify_apk_arm64.py' -v
          python3 -m unittest discover -s tool -p 'test_verify_release_keep_rules.py' -v
          python3 -m unittest discover -s tool -p 'test_prepare_release.py' -v
          python3 -m unittest discover -s tool -p 'test_promote_prerelease.py' -v
          bash -n tool/fetch_proot.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          # Restores ~/.gradle (dependencies and wrapper) keyed on the Gradle
          # build files; the later Java 21 step reuses the same directory.
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Resolve locked Flutter dependencies and generate locales
        run: |
          flutter pub get
          flutter gen-l10n
          git diff --exit-code -- pubspec.lock lib/l10n
      # Pull requests run the same analyzer and tests in pr-check.yml.
      - name: Verify full application checks for a release
        if: env.BUILD_VARIANT == 'release' && github.event_name != 'pull_request'
        run: |
          dart analyze --fatal-infos lib test integration_test
          flutter test
      - name: Prepare the existing permanent release identity, never a new debug key
        if: env.BUILD_VARIANT == 'release'
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/master' || test "$SAME_REPO_PR" = 'true' || { echo 'Stable signing is allowed only from master or a pull request of this repository'; exit 1; }
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ('SIGN_KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')
          missing = [key for key in names if not os.environ.get(key)]
          if missing:
              raise SystemExit('Permanent release signing is not configured: ' + ', '.join(missing))
          pin = Path('.github/moru-signing-cert-sha256.txt')
          if not pin.is_file():
              raise SystemExit('Pin the permanent public certificate in .github/moru-signing-cert-sha256.txt first')
          cert = pin.read_text().strip().lower()
          if len(cert) != 64 or any(c not in '0123456789abcdef' for c in cert):
              raise SystemExit('Invalid public signing-certificate pin')
          key = Path('android/app/moru-release.jks')
          key.write_bytes(base64.b64decode(''.join(os.environ['SIGN_KEYSTORE_BASE64'].split()), validate=True))
          key.chmod(0o600)
          def escaped(value):
              raw = value.encode('utf-16-be')
              return ''.join('\\u' + raw[i:i+2].hex() for i in range(0, len(raw), 2))
          props = {'storeFile': 'moru-release.jks', 'storePassword': os.environ['KEYSTORE_PASSWORD'],
                   'keyAlias': os.environ['KEY_ALIAS'], 'keyPassword': os.environ['KEY_PASSWORD']}
          path = Path('android/key.properties')
          path.write_text(''.join(name + '=' + escaped(value) + '\n' for name, value in props.items()))
          path.chmod(0o600)
          PY
      - name: Fetch and verify only the pinned arm64 PRoot runtime
        run: |
          bash tool/fetch_proot.sh
          sha256sum --check tool/proot_checksums.txt
      - name: Build one Android arm64 APK
        shell: bash
        run: |
          case "$BUILD_VARIANT" in debug|release) ;; *) exit 1;; esac
          flutter build apk --"$BUILD_VARIANT" --target-platform=android-arm64
          mapfile -t apks < <(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk')
          test "${#apks[@]}" -eq 1 || { printf 'Expected one APK, got %s\n' "${#apks[@]}"; exit 1; }
          mkdir -p out reports
          cp "${apks[0]}" "out/Moru-arm64-v8a-$BUILD_VARIANT.apk"
          python3 tool/verify_apk_arm64.py "out/Moru-arm64-v8a-$BUILD_VARIANT.apk" > reports/apk-abi.json
          cat reports/apk-abi.json
          # R8 only runs for release; debug APKs keep every signature.
          if [ "$BUILD_VARIANT" = release ]; then
            python3 tool/verify_release_keep_rules.py "out/Moru-arm64-v8a-$BUILD_VARIANT.apk"
          fi
      # Robolectric needs Java 21 to run the API 36 refresh-rate tests.
      # Keep the APK build on the existing Java 17 toolchain above.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Android JVM unit tests without building another architecture
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest -Ptarget-platform=android-arm64 --stacktrace
      - name: Verify APK signature and record actual package metadata
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bt="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          apk="out/Moru-arm64-v8a-$BUILD_VARIANT.apk"
          "$bt/apksigner" verify --verbose --print-certs "$apk" > reports/signature.txt
          "$bt/aapt2" dump badging "$apk" > reports/badging.txt
          if [ "$BUILD_VARIANT" = release ]; then
            actual="$(grep -m1 'certificate SHA-256 digest:' reports/signature.txt | sed 's/^.*certificate SHA-256 digest: //' | tr 'A-F' 'a-f' | tr -d ':\r\n ')"
            expected="$(tr -d '\r\n ' < .github/moru-signing-cert-sha256.txt)"
            test "$actual" = "$expected"
            ! grep -q 'application-debuggable' reports/badging.txt
          fi
          sha256sum "$apk" > reports/apk.sha256
      - name: Upload the single APK
        uses: actions/upload-artifact@v7
        with:
          name: Moru-android-arm64-${{ env.BUILD_VARIANT }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports (not additional applications)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Moru-android-verification
          path: |
            reports/
            build/app/test-results/**
            build/app/reports/tests/**
          retention-days: 14
      - name: Remove private signing files
        if: always()
        run: rm -f android/key.properties android/app/moru-release.jks
  publish:
    name: Publish verified stable arm64 release
    needs: android
    # A master version bump or release workflow change produces a signed APK
    # artifact only. Publishing is a separate workflow_dispatch opt-in.
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.variant == 'release' &&
      inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: Moru-android-arm64-release
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: Moru-android-verification
          path: verification
      - name: Recheck and package the exact verified APK
        run: |
          python3 tool/verify_apk_arm64.py out/Moru-arm64-v8a-release.apk
          python3 tool/prepare_release.py --apk-dir out --reports-dir verification --output dist --commit "$GITHUB_SHA"
      - name: Publish one APK with checksums and public verification metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(python3 -c 'import json; print(json.load(open("dist/release-metadata.json"))["tag"])')"
          existing="$(git ls-remote --tags origin "refs/tags/$tag")"
          test -z "$existing" || { echo "Refusing to replace existing tag $tag"; exit 1; }
          test -s "docs/releases/$tag.md"
          {
            cat "docs/releases/$tag.md"
            printf '\n## Проверка APK\n\n```json\n'
            cat dist/release-metadata.json
            printf '```\n'
          } > dist/release-notes.md
          gh release create "$tag" dist/*.apk dist/*.sha256 dist/release-metadata.json --draft --target "$GITHUB_SHA" --title "Moru $tag" --notes-file dist/release-notes.md
          gh release edit "$tag" --draft=false --latest
          gh release view "$tag" --json url,tagName,isDraft,assets
  prerelease:
    name: Publish signed arm64 pre-release
    needs: android
    # Each push to a pull request of this repository replaces the previous
    # pre-release; it installs over the stable app because the key is the same.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: moru-prerelease
      cancel-in-progress: false
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: Moru-android-arm64-release
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: Moru-android-verification
          path: verification
      - name: Recheck and package the exact verified APK
        run: |
          python3 tool/verify_apk_arm64.py out/Moru-arm64-v8a-release.apk
          python3 tool/prepare_release.py --apk-dir out --reports-dir verification --output dist --commit "$HEAD_SHA" --prerelease "$GITHUB_RUN_NUMBER"
      - name: Publish the pre-release and remove older ones
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(python3 -c 'import json; print(json.load(open("dist/release-metadata.json"))["tag"])')"
          # Only the APK: its tag names the version, its target the commit.
          gh release create "$tag" dist/*.apk --prerelease --target "$HEAD_SHA" --title "Moru $tag" --notes ''
          gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' |
            while read -r old; do
              if [ "$old" != "$tag" ]; then gh release delete "$old" --yes --cleanup-tag; fi
            done
          gh release view "$tag" --json url,tagName,isPrerelease,assets
  promote:
    name: Promote the tested pre-release to the stable release
    # A merge whose tree equals the last pre-release's commit publishes that
    # exact APK as the stable release. Anything else keeps the manual dispatch.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: moru-prerelease
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish the tested APK under the stable tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          pre="$(gh release list --limit 100 --json tagName,isPrerelease,createdAt --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | last | .tagName // empty')"
          if [ -z "$pre" ]; then echo 'No pre-release to promote; publish with the manual release dispatch.'; exit 0; fi
          gh release download "$pre" --dir pre --pattern '*.apk'
          tested="$(gh release view "$pre" --json targetCommitish --jq .targetCommitish)"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$tested"
          if [ "$(git rev-parse "$tested^{tree}")" != "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "master differs from the code of $pre; publish with the manual release dispatch."
            exit 0
          fi
          python3 tool/promote_prerelease.py --apk "pre/Moru-$pre-arm64-v8a-release.apk" --tag "$pre" --tested-commit "$tested" --output dist --commit "$GITHUB_SHA"
          tag="$(python3 -c 'import json; print(json.load(open("dist/release-metadata.json"))["tag"])')"
          existing="$(gh release view "$tag" --json tagName --jq .tagName 2>/dev/null || true)"
          test -z "$existing" || { echo "Refusing to replace existing release $tag"; exit 1; }
          test -s "docs/releases/$tag.md"
          {
            cat "docs/releases/$tag.md"
            printf '\n## Проверка APK\n\n```json\n'
            cat dist/release-metadata.json
            printf '```\n'
          } > dist/release-notes.md
          gh release create "$tag" dist/*.apk dist/*.sha256 dist/release-metadata.json --draft --target "$GITHUB_SHA" --title "Moru $tag" --notes-file dist/release-notes.md
          gh release edit "$tag" --draft=false --latest
          gh release delete "$pre" --yes --cleanup-tag
          gh release view "$tag" --json url,tagName,isDraft,assets
