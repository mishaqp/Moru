name: Mini apps workspace snapshot (temporary)

on:
  push:
    branches: [codex/moru-web-mini-apps-offline-20261006]
    paths: [.github/workflows/_moru_web_mini_apps_workspace.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3db99c060201b3be5374f6d565677a21d54a1c58
          persist-credentials: false
      - name: Archive the requested base without credentials or generated files
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/moru-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: moru-mini-apps-source
          path: ${{ runner.temp }}/moru-source.tar.gz
          retention-days: 1
          if-no-files-found: error
