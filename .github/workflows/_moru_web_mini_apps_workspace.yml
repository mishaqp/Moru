name: Mini apps development checks (temporary)
on:
  push:
    branches: [codex/moru-web-mini-apps-offline-20261006]
    paths: [.github/workflows/_moru_web_mini_apps_workspace.yml]
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: JavaScript bridge contracts
        run: node --test tool/test_mini_app_web_runtime.cjs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.moru-toolchains
            ~/.pub-cache
          key: moru-mini-apps-flutter-3.44.9-${{ hashFiles('pubspec.yaml') }}
      - run: bash tool/codex_cloud_setup.sh
      - name: Dart publishing and host contracts
        run: |
          source "$HOME/.moru-toolchains/activate.sh"
          flutter test test/core/services/mini_apps/mini_app_content_server_test.dart test/core/services/mini_apps/mini_app_publisher_test.dart --reporter expanded
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 37399101203
          name: moru-pinned-vendor-sources
          github-token: ${{ github.token }}
          path: vendor
      - name: Inspect exact browser exports and third-party notices
        shell: python
        run: |
          import pathlib,tarfile,re,json
          for archive in sorted(pathlib.Path('vendor').glob('*.tgz')):
              print('\nPACKAGE',archive.stem)
              with tarfile.open(archive) as tar:
                  files={m.name:m for m in tar if m.isfile()}
                  for name in ['package/LICENSE','package/LICENSE.md']:
                      if name in files: print(tar.extractfile(files[name]).read().decode())
                  for name in ['package/dist/browser.js','package/dist/phaser.js','package/dist/chart.umd.js']:
                      if name not in files: continue
                      text=tar.extractfile(files[name]).read().decode()
                      print('BROWSER HEADER',text[:1200])
                      print('BROWSER EXPORTS',text[-2000:])
                      notices=sorted({line.strip() for line in text.splitlines() if re.search(r'copyright|@license|license:|licensed under',line,re.I)})
                      print('NOTICES\n'+'\n'.join(line[:400] for line in notices[:100]))
                  special=[m for n,m in files.items() if n.endswith('license.js') or 'LICENSE' in n and 'spine' not in n.lower()]
                  for m in special[:12]: print(m.name,tar.extractfile(m).read().decode()[:5000])
