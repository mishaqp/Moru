name: Mini apps workspace setup (temporary)

on:
  push:
    branches: [codex/moru-web-mini-apps-offline-20261006]
    paths: [.github/workflows/_moru_web_mini_apps_workspace.yml]

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3db99c060201b3be5374f6d565677a21d54a1c58
          persist-credentials: false
      - name: Use the repository's pinned, verified cloud setup
        run: bash tool/codex_cloud_setup.sh
      - name: Baseline mini-app tests and host test-engine preparation
        run: |
          source "$HOME/.moru-toolchains/activate.sh"
          flutter test test/core/services/mini_apps --reporter expanded
      - name: Archive only the public SDK and resolved package cache for offline checks
        run: |
          cp pubspec.lock "$RUNNER_TEMP/pubspec.lock"
          tar -C "$HOME" -czf "$RUNNER_TEMP/moru-sdk.tar.gz" .moru-toolchains
          tar -C "$HOME" --exclude=credentials.json --exclude=log --exclude=_temp -czf "$RUNNER_TEMP/moru-pub-cache.tar.gz" .pub-cache
      - uses: actions/upload-artifact@v4
        with:
          name: moru-mini-apps-sdk
          path: ${{ runner.temp }}/moru-sdk.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: moru-mini-apps-packages
          path: |
            ${{ runner.temp }}/moru-pub-cache.tar.gz
            ${{ runner.temp }}/pubspec.lock
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
