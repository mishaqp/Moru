name: Moru Android locale polish (temporary)
on:
  push:
    branches: ['feat/ru-android-polish']
    paths: ['.github/workflows/moru-polish-development.yml', 'tool/moru-polish/run.txt']
permissions:
  contents: write
concurrency:
  group: moru-polish-dev
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Integrate only the reviewed commits and remove temporary staging
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'feat/ru-android-polish'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tool/moru-polish/integrate.py
          flutter gen-l10n
          git ls-files -m -o --exclude-standard -- lib test | grep '\.dart$' | xargs -r dart format || test "${PIPESTATUS[1]}" = 1
          python3 tool/test_check_moru_ru.py
          python3 tool/check_moru_ru.py
          python3 -m unittest discover -s tool -p 'test_android_only_policy.py' -v
          python3 -m unittest discover -s tool -p 'test_verify_apk_arm64.py' -v
          git diff --check
      - name: Russian, English and Android settings navigation regressions
        shell: bash
        run: flutter test test/l10n test/core/providers/moru_locale_preferences_test.dart test/core/providers/settings_provider_locale_test.dart test/features/settings/search/settings_search_widgets_test.dart --reporter expanded 2>&1 | tee locale-regressions.log
      - name: Analyze all application code and tests
        shell: bash
        run: dart analyze --fatal-infos lib test integration_test 2>&1 | tee analyzer.log
      - name: Commit reviewed integration without overwriting concurrent work
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/feat/ru-android-polish | cut -f1)" = "$GITHUB_SHA"
          git add -u
          git add docs/MORU_RUSSIAN_LOCALIZATION.md .github/workflows/pr-check.yml
          if ! git diff --cached --quiet; then
            git commit -m 'l10n(ru): integrate complete Russian Android UI and permanent locale validation'
          fi
          git push origin HEAD:refs/heads/feat/ru-android-polish
      - name: Export exact integration source and reports
        if: always()
        shell: bash
        run: |
          mkdir -p review
          cp -R lib review/lib
          cp -R test review/tests
          git diff 63aa1f33bf90d1d9d986ccb52e2f07dcfd2e1028 --stat > diff-stat.txt
          git diff 63aa1f33bf90d1d9d986ccb52e2f07dcfd2e1028 -- lib test .github tool docs > source-diff.patch
          git rev-parse HEAD > verified-source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moru-android-polish-review
          path: |
            locale-regressions.log
            analyzer.log
            diff-stat.txt
            source-diff.patch
            verified-source-sha.txt
            review/
          retention-days: 14
