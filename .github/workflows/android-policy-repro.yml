name: Android-only policy baseline (temporary)
on:
  push:
    branches: ['build/android-arm64-only']
    paths: ['.github/workflows/android-policy-repro.yml']
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check requested Android-only constraints before changes
        run: python3 -m unittest discover -s tool -p 'test_android_only_policy.py' -v
