name: OAuth callback regression
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare local review tools and canonical source formatting
        run: |
          dart format lib/core/services/auth test/core/services/auth/oauth_android_recovery_test.dart
          tar -czf "$RUNNER_TEMP/moru-dart-sdk.tgz" -C "$FLUTTER_ROOT/bin/cache" dart-sdk
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/moru-formatted-source.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: moru-oauth-review
          path: |
            ${{ runner.temp }}/moru-dart-sdk.tgz
            ${{ runner.temp }}/moru-formatted-source.tgz
          retention-days: 1
      - name: Run callback and transport regressions
        run: flutter test test/core/services/auth/oauth_android_recovery_test.dart --reporter expanded
