name: OAuth callback regression
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  regression:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/android-oauth-return-v0.1.2'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply exactly the reviewed source diff, never signing material
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = Path('.github/oauth-fix.b64').read_text().strip()
          encoded = encoded.replace('EdLDLDnL2', 'EdLDnL2').replace('I/V+eI/V+wh', 'I/V+wh')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = 'fd7e692411212c7cbf03fd396ce5d2d7e036500a3e6327cdc406b9b36cd0c515'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Reviewed source diff checksum mismatch')
          Path(os.environ['RUNNER_TEMP'], 'oauth-fix.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/oauth-fix.patch"
          git apply "$RUNNER_TEMP/oauth-fix.patch"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Canonical formatting and complete static analysis
        run: |
          dart format lib/core/services/auth/chatgpt_browser_oauth.dart lib/core/services/auth/codex_oauth_callback.dart lib/core/services/auth/oauth_callback_io.dart lib/core/services/auth/oauth_diagnostics.dart lib/core/services/auth/provider_oauth_adapter.dart lib/features/provider/widgets/oauth_login_panel.dart test/core/services/auth/mobile_loopback_oauth_test.dart test/core/services/auth/oauth_android_recovery_test.dart test/core/services/auth/oauth_transport_integration_test.dart
          dart analyze --fatal-infos lib test integration_test
      - name: Exercise callback, live local HTTP transport, cancellation and UI regressions
        run: flutter test test/core/services/auth test/core/services/network test/core/services/mcp/mcp_oauth_callback_android_test.dart test/codex_login_compatibility_test.dart test/features/provider/oauth_widgets_test.dart --reporter expanded
      - name: Commit verified sources to this PR branch only
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          test "$TARGET_BRANCH" = 'fix/android-oauth-return-v0.1.2'
          git diff --check
          git add lib/core/services/auth lib/features/provider/widgets/oauth_login_panel.dart test/core/services/auth pubspec.yaml docs/releases/v0.1.2.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: recover Android Codex browser login and expose safe transport diagnostics'
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Archive review evidence without private credentials
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/oauth-evidence"
          cp .github/oauth-fix.b64 "$RUNNER_TEMP/oauth-evidence/"
          git diff > "$RUNNER_TEMP/oauth-evidence/working.diff"
          git log -1 --format='%H %s' > "$RUNNER_TEMP/oauth-evidence/commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moru-oauth-evidence
          path: ${{ runner.temp }}/oauth-evidence
          retention-days: 1
